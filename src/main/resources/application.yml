spring:
  application:
    name: moviepick
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

# PortOne V2 결제 (비밀값은 환경변수 또는 application-local.yml로 주입)
portone:
  base-url: https://api.portone.io
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}

logging:
  level:
    org.hibernate.SQL: debug
