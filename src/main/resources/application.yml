spring:
  profiles:
    active: local
  # 프로젝트 맨 위의 .env를 설정으로 읽는다 (없으면 무시). docker compose와 같은 파일
  config:
    import: optional:file:.env[.properties]
  # Docker MySQL (docker-compose.yml). 값은 .env에서 읽고, 기본값은 compose와 같다
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:moviepick}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:moviepick}
    password: ${MYSQL_PASSWORD:}
  # Docker Redis (docker-compose.yml)
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6380}
      timeout: 3s
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY:local-dummy}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            provider: kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  jpa:
    open-in-view: false
    hibernate:
      # DB 구조는 db/schema.sql로 관리. 엔티티와 DB가 다르면 앱이 켜지지 않는다
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
jwt:
  secret: ${JWT_SECRET:}
portone:
  base-url: https://api.portone.io
  api-secret: ${PORTONE_API_SECRET:}
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
logging:
  level:
    org.hibernate.SQL: debug
tmdb:
  access-token: ${TMDB_ACCESS_TOKEN}